# Broker de la Nave. Lo arranca docker compose (servicio mosquitto).
# Los usuarios y contraseñas NO se guardan aquí: se generan al arrancar desde el .env de la raíz.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/secure/passwd
acl_file /mosquitto/secure/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
