; Firmware de la pulsera (ESP32 + Arduino)
; Compilar y subir:  pio run -t upload   |   Monitor serial:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    ; Librerías de sensores: agregarlas aquí al integrar cada uno (MAX30100, BMI160, AHT20, BMP280, SSD1306)
